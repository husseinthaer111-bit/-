name: Build Flet APK

on:
  push:
    branches: [ main, master, "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-versions@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install flet[all] firebase-admin

      - name: Build APK
        run: |
          flet build apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: build/apk/*.apk
