name: Build Flet APK

on:
  push:
    branches: [ main, master, "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet firebase-admin

      - name: Create Flutter Project
        run: |
          flet build apk --project-name app || true

      - name: Build APK via Flutter CLI
        run: |
          if [ -d "build/apk" ]; then
            echo "Directory exists"
          elif [ -d "build/flutter" ]; then
            cd build/flutter && flutter build apk --release
          else
            flet build apk --no-interactive
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            build/apk/*.apk
            build/flutter/build/app/outputs/flutter-apk/*.apk
